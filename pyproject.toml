[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hosaka-citations"
version = "0.4.0"
description = "Offline-first Hosaka citations and portable operator commands"
requires-python = ">=3.10"

[project.optional-dependencies]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[project.scripts]
cite = "citations.terminal:main"
citations-setup = "citations.cli:main"

[tool.setuptools]
package-dir = {citations = "extension/citations", citations_web = "web/local/citations_web"}
packages = ["citations", "citations_web"]
include-package-data = true

[tool.setuptools.package-data]
citations = ["migrations/*.sql", "migrations/*/*.sql", "seeds/*.json", "seeds/*.sql", "schemas/*.json"]
citations_web = ["static/*"]
